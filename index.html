<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOKCHI VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-secondary: #8E8E93;
            --accent-blue: #0A84FF;
            --accent-orange: #FF9F0A;
            --accent-gray: #2C2C2E;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
        }
        .header { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 700; }
        
        .interactive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-gray);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            text-align: left;
        }
        .stat-card:active {
            transform: scale(0.96);
            background-color: var(--accent-gray);
        }
        
        .stat-card i { font-size: 20px; }
        .days-icon { color: var(--accent-orange); }
        .device-icon { color: var(--accent-blue); }
        
        .stat-val { font-size: 22px; font-weight: 800; }
        .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }

        .section-title { width: 100%; text-align: left; font-size: 13px; color: var(--text-secondary); margin: 10px 0 8px 10px; text-transform: uppercase; }
        .action-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .menu-item {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--accent-gray);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>NOKCHI VPN</span>
        <span style="color: #30D158">● Online</span>
    </div>

    <div class="interactive-grid">
        <div class="stat-card" onclick="extendSubscription()">
            <i class="fa-solid fa-calendar-day days-icon"></i>
            <div>
                <div class="stat-val" id="days-val">24 дн.</div>
                <div class="stat-label">Продлить</div>
            </div>
        </div>

        <div class="stat-card" onclick="manageDevices()">
            <i class="fa-solid fa-laptop-mobile device-icon"></i>
            <div>
                <div class="stat-val" id="dev-val">1 / 3</div>
                <div class="stat-label">Устройства</div>
            </div>
        </div>
    </div>

    <div class="section-title">Быстрые действия</div>
    <div class="action-list">
        <div class="menu-item" onclick="updateKey()">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fa-solid fa-key" style="color: #FFD60A; width: 20px;"></i>
                <span style="font-weight: 600;">Обновить ключ</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-secondary); font-size: 12px;"></i>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000';

        function extendSubscription() {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showConfirm("Перейти к выбору тарифа для продления?", (ok) => {
                if(ok) {
                    tg.sendData("action_extend"); 
                    tg.close();
                }
            });
        }

        function manageDevices() {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showConfirm("Открыть управление устройствами?", (ok) => {
                if(ok) {
                    tg.sendData("action_manage_devices");
                    tg.close();
                }
            });
        }

        function updateKey() {
            tg.HapticFeedback.notificationOccurred('warning');
            tg.showConfirm("Сгенерировать новый ключ? Старый перестанет работать.", (ok) => {
                if(ok) {
                    tg.sendData("action_update_key");
                    tg.close();
                }
            });
        }
    </script>
</body>
</html>
